name: configure-and-build
description: "Build OpenCV using CMake"

inputs:
  workdir:
    description: "Work directory on executor, repositories will be cloned to opencv/opencv_contrib/opencv_extra"
  builddir:
    description: "Build directory"
    default: "build"
  generator:
    description: "CMake generator, e.g. Ninja"
  options:
    description: "Extra CMake options"
  msbuild_shared_cap:
    description: "Enable shared compiler-process scheduling for Windows Visual Studio builds"
    default: "false"
  msbuild_compiler_jobs:
    description: "Positive shared compiler/project budget; required only when msbuild_shared_cap is true"
    default: ""

runs:
  using: "composite"
  steps:

    - name: Validate shared MSBuild scheduling
      if: ${{ inputs.msbuild_shared_cap != 'false' || inputs.msbuild_compiler_jobs != '' }}
      shell: bash
      env:
        OCV_GENERATOR: ${{ inputs.generator }}
        OCV_SHARED_CAP: ${{ inputs.msbuild_shared_cap }}
        OCV_COMPILER_JOBS: ${{ inputs.msbuild_compiler_jobs }}
      run: |
        if [[ "$OCV_SHARED_CAP" != "true" ]]; then
          echo "::error::A compiler budget requires msbuild_shared_cap=true."
          exit 2
        fi
        if [[ "$RUNNER_OS" != "Windows" || "$OCV_GENERATOR" != "Visual Studio "* ]]; then
          echo "::error::Shared MSBuild scheduling requires Windows and a Visual Studio generator."
          exit 2
        fi
        if [[ ! "$OCV_COMPILER_JOBS" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::msbuild_compiler_jobs must be a positive decimal integer."
          exit 2
        fi

    - working-directory: ${{ inputs.workdir }}
      shell: bash
      run: |
        echo "::group::Configure"
        rm -rf '${{ inputs.builddir }}'
        mkdir -p '${{ inputs.builddir }}'
        cmake \
          -S opencv \
          -B '${{ inputs.builddir }}' \
          -G '${{ inputs.generator }}' \
          ${{ inputs.options }}
        echo "::endgroup::"

    - working-directory: ${{ inputs.workdir }}
      shell: bash
      env:
        OCV_BUILD_DIR: ${{ inputs.builddir }}
        OCV_SHARED_CAP: ${{ inputs.msbuild_shared_cap }}
        OCV_COMPILER_JOBS: ${{ inputs.msbuild_compiler_jobs }}
      run: |
        set -x
        echo "::group::Build"
        msbuild_args=()
        if [ "$RUNNER_OS" == "Windows" ]; then
          cfg="--config Release"
        fi
        if [ "$OCV_SHARED_CAP" == "true" ]; then
          msbuild_args=(--parallel "$OCV_COMPILER_JOBS" --
            /p:MultiProcCL=true "/p:MultiProcMaxCount=$OCV_COMPILER_JOBS"
            /p:EnforceProcessCountAcrossBuilds=true /nr:false)
          # Git Bash must not rewrite native MSBuild switches as filesystem paths.
          if [ "${MSYS2_ARG_CONV_EXCL:-}" != "*" ]; then
            export MSYS2_ARG_CONV_EXCL="${MSYS2_ARG_CONV_EXCL:+${MSYS2_ARG_CONV_EXCL};}/p:;/nr:"
          fi
        fi
        cmake --build "$OCV_BUILD_DIR" ${cfg} "${msbuild_args[@]}" 2>&1 | tee "$OCV_BUILD_DIR/log.txt"
        echo "::endgroup::"

    - shell: bash
      run: |
        pyexe=python3
        if [ "$RUNNER_OS" == "Windows" ]; then
          pyexe=python
        fi
        set +e
        ${pyexe} ./scripts/warnings-handling.py \
          '${{ inputs.workdir }}/${{ inputs.builddir }}/log.txt'
        if [ $? -ne 0 ]; then
          echo "WARNINGS=1" >> $GITHUB_ENV
        fi

    - shell: bash
      run: |
        set -x
        echo "::group::Stat"
        if [ "$RUNNER_OS" == "Windows" ]; then
          echo "No statistics on Windows for now"
        else
          ccache --show-stats
        fi
        echo "::endgroup::"
